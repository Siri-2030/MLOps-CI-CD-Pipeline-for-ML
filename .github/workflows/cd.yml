name: CD Pipeline

# Triggers only after the CI Pipeline workflow completes on main.
# This is the enforcement mechanism for Section 15: if CI's model
# validation step failed, this workflow never starts at all.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  cd:
    runs-on: ubuntu-latest
    # Only proceed if the triggering CI run actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write # required to push to GHCR

    env:
      DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the exact commit that CI validated, not
          # whatever is newest on main - guarantees we deploy
          # precisely what was tested.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Configure DVC remote credentials
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USERNAME"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      - name: Pull dataset via DVC
        run: dvc pull

      # Re-train to produce models/model.pkl for the image build.
      # (CI validated this exact commit already - retraining here
      # with the same fixed random_state reproduces the identical
      # model, avoiding the need to pass build artifacts between
      # separate workflow runs.)
      - name: Train model
        run: python -m src.train

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/wine-quality-api" >> $GITHUB_ENV

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/wine-quality-api" >> $GITHUB_ENV

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/wine-quality-api" >> $GITHUB_ENV

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/wine-quality-api" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.event.workflow_run.head_sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push image to GHCR
        run: |
          docker push $IMAGE_NAME:${{ github.event.workflow_run.head_sha }}
          docker push $IMAGE_NAME:latest

      - name: Deploy locally via Docker Compose (student demo target)
        run: |
          docker run -d -p 8000:8000 --name wine-api-cd $IMAGE_NAME:latest
          sleep 5

      - name: Health check deployed container
        run: |
          curl -f http://localhost:8000/health || (echo "Health check failed" && exit 1)

      - name: Verify /predict endpoint on deployed container
        run: |
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"fixed acidity":7.4,"volatile acidity":0.7,"citric acid":0.0,"residual sugar":1.9,"chlorides":0.076,"free sulfur dioxide":11,"total sulfur dioxide":34,"density":0.9978,"pH":3.51,"sulphates":0.56,"alcohol":9.4}'

      - name: Report deployment success
        if: success()
        run: echo "Deployment succeeded. Image pushed to $IMAGE_NAME:latest and health-checked."

      - name: Report deployment failure
        if: failure()
        run: echo "Deployment failed - see failed step above for details."

      - name: Clean up test container
        if: always()
        run: docker rm -f wine-api-cd || true